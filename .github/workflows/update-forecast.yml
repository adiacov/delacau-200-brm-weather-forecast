name: Update weather forecast

on:
  schedule:
    # Around 06:00 Moldova time during summer time (UTC+3).
    # Avoid minute 0 because GitHub scheduled jobs are often delayed/dropped at peak times.
    - cron: "12 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate forecast
        run: python3 brevet_delacau_weather_research.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
          else
            git commit -m "Update daily weather forecast"
            git push
          fi
